name: Question or docs fix
description: Ask a question, or report a mistake in the documentation.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question, or the docs page and what is wrong
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: aerix --version
      description: Optional.
      render: text
    validations:
      required: false
